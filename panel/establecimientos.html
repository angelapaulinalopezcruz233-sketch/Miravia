<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miravia · Mis establecimientos</title>
    <link rel="stylesheet" href="../estilo/panel.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <i class="fa-solid fa-map-location-dot"></i>
            <span>Miravia</span>
        </div>

        <nav class="sidebar-menu">
            <a href="dashboard.html" class="menu-item">
                <i class="fa-solid fa-chart-line"></i> Dashboard
            </a>
            <a href="establecimientos.html" class="menu-item active">
                <i class="fa-solid fa-hotel"></i> Mis establecimientos
            </a>
            <a href="reservaciones.html" class="menu-item">
                <i class="fa-solid fa-calendar-check"></i> Reservaciones
            </a>
            <a href="comisiones.html" class="menu-item">
                <i class="fa-solid fa-percent"></i> Comisiones
            </a>
            <a href="estado-cuenta.html" class="menu-item">
                <i class="fa-solid fa-file-invoice-dollar"></i> Estado de cuenta
            </a>
            <a href="reportes.html" class="menu-item">
                <i class="fa-solid fa-chart-pie"></i> Reportes
            </a>
            <a href="perfil.html" class="menu-item">
                <i class="fa-solid fa-user"></i> Perfil
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="../inicio.html" class="menu-item logout">
                <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
            </a>
        </div>
    </aside>

    <!-- CONTENIDO -->
    <main class="content">

        <!-- HEADER -->
        <header class="topbar">
            <div>
                <h1>Mis establecimientos</h1>
                <p class="subtitulo">Gestiona tus hoteles, restaurantes y atracciones</p>
            </div>
            <div class="topbar-actions">
                <button class="btn-primario">
                    <i class="fa-solid fa-plus"></i> Nuevo establecimiento
                </button>
            </div>
        </header>

        <!-- FILTROS -->
        <section class="filtros">
            <button class="chip active" data-filtro="todos">Todos</button>
            <button class="chip" data-filtro="hotel">
                <i class="fa-solid fa-hotel"></i> Hoteles
            </button>
            <button class="chip" data-filtro="restaurante">
                <i class="fa-solid fa-utensils"></i> Restaurantes
            </button>
            <button class="chip" data-filtro="atraccion">
                <i class="fa-solid fa-ticket"></i> Atracciones
            </button>
        </section>

        <!-- GRID DE ESTABLECIMIENTOS -->
        <section class="grid-establecimientos" id="grid-establecimientos"></section>

    </main>

</div>

<script src="../js/panel-mock.js"></script>
<script src="../js/panel-api.js"></script>
<script src="../js/panel-establecimientos.js"></script>
</body>
</html>
