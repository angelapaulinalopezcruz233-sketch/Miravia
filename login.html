<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIRAVIA | Iniciar sesión</title>

    <!-- Fuente -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="estilo/login-diseno.css?v=login-03">

</head>

<body>

    <main class="login">

        <section class="login-contenedor">

            <!-- ================================================= -->
            <!-- PARTE IZQUIERDA -->
            <!-- ================================================= -->

            <div class="login-visual">

                <div class="login-globo"
                     id="loginGlobo"
                     aria-hidden="true">
                </div>

                <div class="logo">
                    MIRAVIA
                </div>

                <div class="avion">
                    ✈
                </div>

                <div class="visual-contenido">

                    <p>
                        Bienvenidos a MIRAVIA, donde descubres
                        tu nueva aventura.
                    </p>

                </div>

            </div>


            <!-- ================================================= -->
            <!-- PARTE DERECHA -->
            <!-- ================================================= -->

            <div class="login-formulario">

                <!-- ENCABEZADO -->

                <div class="encabezado">

                    <div class="icono-login">
                        ✈
                    </div>

                    <h2 id="tituloAcceso">
                        Iniciar sesión
                    </h2>

                    <p id="descripcionAcceso">
                        Entra a MIRAVIA para continuar tu viaje.
                    </p>

                </div>


                <!-- ================================================= -->
                <!-- FORMULARIO LOGIN -->
                <!-- ================================================= -->

                <form id="formLogin"
                      autocomplete="on"
                      novalidate>

                    <!-- USUARIO -->

                    <div class="campo">

                        <label for="usuario">
                            Nombre de usuario
                        </label>

                        <div class="input-contenedor">

                            <span aria-hidden="true">
                                👤
                            </span>

                            <input
                                type="text"
                                id="usuario"
                                name="usuario"
                                minlength="3"
                                maxlength="30"
                                autocomplete="username"
                                placeholder="Tu nombre de usuario"
                                required>

                        </div>

                    </div>


                    <!-- CONTRASEÑA -->

                    <div class="campo">

                        <label for="password">
                            Contraseña
                        </label>

                        <div class="input-contenedor">

                            <span aria-hidden="true">
                                🔒
                            </span>

                            <input
                                type="password"
                                id="password"
                                name="contrasena"
                                minlength="8"
                                maxlength="72"
                                autocomplete="current-password"
                                placeholder="Ingresa tu contraseña"
                                required>

                            <button
                                type="button"
                                id="mostrarPassword"
                                aria-label="Mostrar u ocultar contraseña">

                                👁

                            </button>

                        </div>

                    </div>


                    <!-- ================================================= -->
                    <!-- OPCIONES -->
                    <!-- ================================================= -->

                    <div class="opciones">

                        <label>

                            <input
                                type="checkbox"
                                id="recordarme"
                                name="recordarme">

                            Recordarme

                        </label>

                        <a href="#">
                            ¿Olvidaste tu contraseña?
                        </a>

                    </div>


                    <!-- MENSAJE LOGIN -->

                    <div
                        id="mensajeLogin"
                        class="mensaje"
                        aria-live="polite">
                    </div>


                    <!-- BOTÓN LOGIN -->

                    <button
                        type="submit"
                        id="btnLogin"
                        class="btn-login">

                        Iniciar sesión

                    </button>

                </form>


                <!-- ================================================= -->
                <!-- FORMULARIO REGISTRO -->
                <!-- ================================================= -->

                <form
                    id="formRegistro"
                    autocomplete="on"
                    hidden
                    novalidate>

                    <!-- NOMBRE -->

                    <div class="campo">

                        <label for="nombreRegistro">
                            Nombre completo
                        </label>

                        <div class="input-contenedor">

                            <span aria-hidden="true">
                                👤
                            </span>

                            <input
                                type="text"
                                id="nombreRegistro"
                                name="nombre"
                                maxlength="100"
                                autocomplete="name"
                                placeholder="Tu nombre"
                                required>

                        </div>

                    </div>


                    <!-- USUARIO -->

                    <div class="campo">

                        <label for="usuarioRegistro">
                            Nombre de usuario
                        </label>

                        <div class="input-contenedor">

                            <span aria-hidden="true">
                                🪪
                            </span>

                            <input
                                type="text"
                                id="usuarioRegistro"
                                name="usuario"
                                minlength="3"
                                maxlength="30"
                                autocomplete="username"
                                placeholder="Elige un usuario"
                                required>

                        </div>

                    </div>


                    <!-- CORREO -->

                    <div class="campo">

                        <label for="correoRegistro">
                            Correo electrónico
                        </label>

                        <div class="input-contenedor">

                            <span aria-hidden="true">
                                ✉
                            </span>

                            <input
                                type="email"
                                id="correoRegistro"
                                name="correo"
                                maxlength="254"
                                autocomplete="email"
                                placeholder="nombre@correo.com"
                                required>

                        </div>

                    </div>


                    <!-- CONTRASEÑA -->

                    <div class="campo">

                        <label for="contrasenaRegistro">
                            Contraseña
                        </label>

                        <div class="input-contenedor">

                            <span aria-hidden="true">
                                🔒
                            </span>

                            <input
                                type="password"
                                id="contrasenaRegistro"
                                name="contrasena"
                                minlength="8"
                                maxlength="72"
                                autocomplete="new-password"
                                placeholder="De 8 a 72 caracteres"
                                required>

                        </div>

                    </div>


                    <!-- CONFIRMAR CONTRASEÑA -->

                    <div class="campo">

                        <label for="confirmarRegistro">
                            Confirmar contraseña
                        </label>

                        <div class="input-contenedor">

                            <span aria-hidden="true">
                                🔒
                            </span>

                            <input
                                type="password"
                                id="confirmarRegistro"
                                name="confirmarContrasena"
                                minlength="8"
                                maxlength="72"
                                autocomplete="new-password"
                                placeholder="Repite tu contraseña"
                                required>

                        </div>

                    </div>


                    <!-- MENSAJE REGISTRO -->

                    <div
                        id="mensajeRegistro"
                        class="mensaje"
                        aria-live="polite">
                    </div>


                    <!-- BOTÓN REGISTRO -->

                    <button
                        type="submit"
                        id="btnRegistro"
                        class="btn-login">

                        Crear cuenta

                    </button>

                </form>


                <!-- ================================================= -->
                <!-- CAMBIAR A REGISTRO -->
                <!-- ================================================= -->

                <div
                    class="registro"
                    id="enlaceRegistro">

                    ¿No tienes una cuenta?

                    <a
                        href="#"
                        id="mostrarRegistro">

                        Crear cuenta

                    </a>

                </div>


                <!-- ================================================= -->
                <!-- CAMBIAR A LOGIN -->
                <!-- ================================================= -->

                <div
                    class="registro"
                    id="enlaceLogin"
                    hidden>

                    ¿Ya tienes una cuenta?

                    <a
                        href="#"
                        id="mostrarLogin">

                        Iniciar sesión

                    </a>

                </div>


                <!-- FRASE -->

                <div class="frase">
                    Viaja. Descubre. Vive.
                </div>

            </div>

        </section>

    </main>


    <!-- THREE.JS -->

    <script src="lib/three.min.js"></script>

    <!-- JAVASCRIPT LOGIN -->

    <script src="js/login.js?v=auth-04"></script>

</body>

</html>
