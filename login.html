<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MIRAVIA | Iniciar sesión</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
            href="estilo/login-diseno.css?v=login-02">

</head>

<body>

    <main class="login">

        <section class="login-contenedor">

            <!-- PARTE IZQUIERDA -->

            <div class="login-visual">

                <div class="login-globo" id="loginGlobo" aria-hidden="true"></div>

                <div class="logo">
                    MIRAVIA
                </div>

                <div class="avion">
                    ✈
                </div>

                <div class="visual-contenido">

                    

                    

                    <p>
                        Bienvenidos a MIRAVIA, donde descubres tu nueva a ventura. 

                </div>

            </div>


            <!-- PARTE DERECHA -->

            <div class="login-formulario">

                <div class="encabezado">

                    <div class="icono-login">
                        ✈
                    </div>

                    <h2 id="tituloAcceso">
                        Iniciar sesión
                    </h2>

                    <p id="descripcionAcceso">
                        Entra a MIRAVIA para continuar tu viaje.
                    </p>

                </div>


                <form id="formLogin" autocomplete="on">

                    <!-- USUARIO -->

                    <div class="campo">

                        <label for="usuario">
                            Usuario o correo
                        </label>

                        <div class="input-contenedor">

                            <span>👤</span>

                            <input
                                type="text"
                                id="usuario"
                                autocomplete="username"
                                placeholder="Ingresa tu usuario"
                                required>

                        </div>

                    </div>


                    <!-- CONTRASEÑA -->

                    <div class="campo">

                        <label for="password">
                            Contraseña
                        </label>

                        <div class="input-contenedor">

                            <span>🔒</span>

                            <input
                                type="password"
                                id="password"
                                    maxlength="72"
                                autocomplete="current-password"
                                placeholder="Ingresa tu contraseña"
                                required>

                            <button
                                type="button"
                                id="mostrarPassword">

                                👁

                            </button>

                        </div>

                    </div>


                    <!-- OPCIONES -->

                    <div class="opciones">

                        <label>

                            <input
                                type="checkbox"
                                id="recordarme">

                            Recordarme

                        </label>

                        <a href="#">
                            ¿Olvidaste tu contraseña?
                        </a>

                    </div>


                    <!-- MENSAJE -->

                    <div
                        id="mensajeLogin"
                        class="mensaje">
                    </div>


                    <!-- BOTÓN -->

                    <button
                        type="submit"
                        id="btnLogin"
                        class="btn-login">

                        Iniciar sesión

                    </button>

                </form>


                <form id="formRegistro" autocomplete="on" hidden>

                    <div class="campo">
                        <label for="nombreRegistro">Nombre completo</label>
                        <div class="input-contenedor">
                            <span>👤</span>
                            <input type="text" id="nombreRegistro" maxlength="100" autocomplete="name" placeholder="Tu nombre" required>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="usuarioRegistro">Nombre de usuario</label>
                        <div class="input-contenedor">
                            <span>🪪</span>
                            <input type="text" id="usuarioRegistro" minlength="3" maxlength="30" autocomplete="username" placeholder="Elige un usuario" required>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="correoRegistro">Correo electrónico</label>
                        <div class="input-contenedor">
                            <span>✉</span>
                            <input type="email" id="correoRegistro" maxlength="254" autocomplete="email" placeholder="tu@correo.com" required>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="contrasenaRegistro">Contraseña</label>
                        <div class="input-contenedor">
                            <span>🔒</span>
                            <input type="password" id="contrasenaRegistro" minlength="8" maxlength="72" autocomplete="new-password" placeholder="De 8 a 72 caracteres" required>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="confirmarRegistro">Confirmar contraseña</label>
                        <div class="input-contenedor">
                            <span>🔒</span>
                            <input type="password" id="confirmarRegistro" minlength="8" maxlength="72" autocomplete="new-password" placeholder="Repite tu contraseña" required>
                        </div>
                    </div>

                    <div id="mensajeRegistro" class="mensaje" aria-live="polite"></div>

                    <button type="submit" id="btnRegistro" class="btn-login">
                        Crear cuenta
                    </button>

                </form>


                <!-- REGISTRO -->

                <div class="registro" id="enlaceRegistro">

                    ¿No tienes una cuenta?

                    <a href="#" id="mostrarRegistro">
                        Crear cuenta
                    </a>

                </div>

                <div class="registro" id="enlaceLogin" hidden>
                    ¿Ya tienes una cuenta?
                    <a href="#" id="mostrarLogin">Iniciar sesión</a>
                </div>


                <div class="frase">
                    Viaja. Descubre. Vive.
                </div>

            </div>

        </section>

    </main>


    <script src="lib/three.min.js"></script>
    <script src="js/login.js?v=auth-03"></script>

</body>

</html>
